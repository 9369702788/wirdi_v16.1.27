name: wirdi
description: "Wirdi - Islamic Companion App with Advanced Features"
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: '^3.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # Firebase - COMPATIBLE VERSIONS
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  firebase_firestore: ^4.13.0
  firebase_messaging: ^14.6.0
  firebase_storage: ^11.5.0
  
  # UI & Widgets
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  lottie: ^2.4.0
  
  # Charts & Analytics
  fl_chart: ^0.65.0
  
  # Audio & Media
  just_audio: ^0.9.36
  audio_session: ^0.1.16
  wakelock_plus: ^1.1.1
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Quran & Islamic
  flutter_compass: ^0.8.0
  geolocator: ^9.0.2
  geocoding: ^2.1.1
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  
  # Home Widget
  home_widget: ^0.4.0
  
  # Offline Support
  connectivity_plus: ^5.0.1
  
  # Utilities
  intl: ^0.19.0
  http: ^1.1.0
  dio: ^5.3.0
  get_it: ^7.6.0
  
  # Date & Time
  table_calendar: ^3.0.9
  
  # PDF & Documents
  pdf: ^3.10.0
  printing: ^5.11.0
  
  # Social Features
  share_plus: ^7.2.0
  
  # Sensors
  sensors_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
  
  # Fonts
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
    
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    
    - family: QuranFont
      fonts:
        - asset: assets/fonts/QuranFont.ttf
