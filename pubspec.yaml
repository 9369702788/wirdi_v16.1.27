name: wirdi
description: "Wirdi - Islamic Companion App with Advanced Features"
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: '^3.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # Firebase - STABLE & TESTED VERSIONS
  firebase_core: ^2.20.0
  firebase_auth: ^4.10.0
  firebase_firestore: ^4.10.0
  firebase_messaging: ^14.6.0
  firebase_storage: ^11.3.0
  
  # UI & Widgets
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.0
  cached_network_image: ^3.2.0
  lottie: ^2.4.0
  
  # Charts
  fl_chart: ^0.63.0
  
  # Audio
  just_audio: ^0.9.31
  audio_session: ^0.1.13
  wakelock_plus: ^1.1.0
  
  # Local Storage
  sqflite: ^2.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Location & Compass
  flutter_compass: ^0.8.0
  geolocator: ^9.0.0
  geocoding: ^2.1.0
  
  # Notifications
  flutter_local_notifications: ^16.0.0
  timezone: ^0.9.0
  
  # Offline
  connectivity_plus: ^5.0.0
  
  # Utilities
  intl: ^0.18.0
  http: ^1.1.0
  dio: ^5.3.0
  get_it: ^7.6.0
  
  # Calendar
  table_calendar: ^3.0.8
  
  # PDF
  pdf: ^3.10.0
  printing: ^5.11.0
  
  # Social
  share_plus: ^7.0.0
  
  # Sensors
  sensors_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
    
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    
    - family: QuranFont
      fonts:
        - asset: assets/fonts/QuranFont.ttf
